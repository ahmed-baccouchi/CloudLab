apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cloudlab
  labels:
    app: api-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ahmedbaccouchi/cloudlab-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: NODE_ENV
            - name: GATEWAY_PORT
              value: "4000"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: AUTH_SERVICE_URL
            - name: LEARNING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: LEARNING_SERVICE_URL
            - name: PROGRESS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: PROGRESS_SERVICE_URL
            - name: PROJECT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: PROJECT_SERVICE_URL
            - name: COMMUNICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: COMMUNICATION_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudlab-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cloudlab
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  selector:
    app: api-gateway

