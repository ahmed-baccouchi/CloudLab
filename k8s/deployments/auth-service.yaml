apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cloudlab
  labels:
    app: auth-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: create-uploads-dir
          image: busybox
          command: ["sh", "-c", "mkdir -p /app/uploads/avatars && chmod -R 777 /app/uploads"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: auth-service
          image: ahmedbaccouchi/cloudlab-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: NODE_ENV
            - name: AUTH_SERVICE_PORT
              value: "4001"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: DATABASE_PORT
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudlab-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              value: "cloudlab_auth"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudlab-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudlab-secrets
                  key: JWT_REFRESH_SECRET
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: cloudlab
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 4001
      targetPort: 4001
      name: http
  selector:
    app: auth-service
