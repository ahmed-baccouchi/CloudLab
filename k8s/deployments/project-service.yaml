apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: cloudlab
  labels:
    app: project-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: ahmedbaccouchi/cloudlab-project-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4005
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: NODE_ENV
            - name: PROJECT_SERVICE_PORT
              value: "4005"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: DATABASE_PORT
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudlab-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              value: "cloudlab_projects"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudlab-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: cloudlab
  labels:
    app: project-service
spec:
  type: ClusterIP
  ports:
    - port: 4005
      targetPort: 4005
      name: http
  selector:
    app: project-service

