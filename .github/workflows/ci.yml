name: CloudLab CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile and type-check monorepo
        run: npm run build

  docker-build-check:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-build
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - learning-service
          - progress-service
          - project-service
          - communication-service
          - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: ahmedbaccouchi/cloudlab-${{ matrix.service }}:test
          load: true

      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ahmedbaccouchi/cloudlab-${{ matrix.service }}:test
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
