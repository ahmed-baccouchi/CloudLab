name: CloudLab CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push-registry:
    name: Build & Push Docker Hub Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - learning-service
          - progress-service
          - project-service
          - communication-service
          - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ahmedbaccouchi/cloudlab-${{ matrix.service }}:latest
            ahmedbaccouchi/cloudlab-${{ matrix.service }}:${{ github.sha }}

  validate-k8s:
    name: Validate Kubernetes Orchestration
    runs-on: ubuntu-latest
    needs: build-and-push-registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Validate K8s Manifests
        run: kubectl kustomize k8s/
